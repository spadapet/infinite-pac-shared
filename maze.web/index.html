<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101026">
    <meta name="description" content="Infinite Pac, recreated for the web with the original graphics and sound.">
    <link rel="icon" href="./assets/main.ico">
    <title>Infinite Pac</title>
</head>
<body>
    <main id="app">
        <section id="cabinet" aria-label="Infinite Pac">
            <div id="game" role="application" aria-label="Infinite Pac" tabindex="0"></div>
            <section id="menu" class="screen-controls" aria-label="Title screen" hidden>
                <button id="start" type="button" aria-label="Play Mr. Pac"></button>
                <button id="start-ms" type="button" aria-label="Play Ms. Lila"></button>
                <button id="players" type="button"></button>
                <button id="difficulty" type="button"></button>
                <button id="sound" type="button"></button>
                <button id="vibration" type="button"></button>
                <button id="fullscreen" type="button"></button>
                <button id="about" type="button" aria-label="About"></button>
            </section>
            <button id="pause" class="play-control" type="button" aria-label="Pause" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7H13V25H7Z M19 7H25V25H19Z"/></svg></button>
            <section id="pause-menu" aria-label="Paused game" hidden>
                <button id="home" class="play-control" type="button" aria-label="End game &amp; return to menu"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 37V21L23 10H24L35 21V37H27V29H20V37Z"/></svg></button>
                <button id="resume" class="play-control" type="button" aria-label="Resume game"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 10L34 23L14 38Z"/></svg></button>
            </section>
            <section id="score-entry" class="screen-controls" aria-label="New high score" hidden></section>
            <dialog id="about-dialog">
                <h1>Infinite Pac</h1>
                <p>Original game and assets &copy; Peter Spada.</p>
                <p>WebGL recreation using the original graphics, audio, and gameplay.</p>
                <form method="dialog"><button>Back</button></form>
            </dialog>
        </section>
        <div id="status" role="status" aria-live="polite">Loading original game assets...</div>
    </main>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
